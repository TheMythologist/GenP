name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v4.2.2
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not query GitHub releases.' }
          if (@($releases | Where-Object tag_name -eq 'v4.2.2').Count -gt 0) { throw 'v4.2.2 already exists; existing releases are never overwritten.' }

      - name: Verify third-party binaries
        run: python verify_binaries.py v4.2.2

      - name: Build v4.2.2
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Bypass -Force
          function global:Read-Host { return 'y' }
          $env:PSModulePath = @(
            "$env:USERPROFILE\Documents\WindowsPowerShell\Modules",
            'C:\Program Files\WindowsPowerShell\Modules',
            'C:\Windows\system32\WindowsPowerShell\v1.0\Modules'
          ) -join ';'
          & .\v4.2.2\build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Package verified runtime
        shell: pwsh
        run: .\package_release.ps1

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          @'
          Extract GenP-v4.2.2.zip and run GenP-v4.2.2.exe with config.ini beside it.

          The ZIP contains only the executable and required configuration. SHA256SUMS.txt and build-manifest.json are provided separately for verification.

          All patches are updated by SpaceDotWho. If you paid for this, you got scammed. This is free.

          Report bugs and application-update problems at https://github.com/SpaceDotWho/GenP/issues. Wiki guides are outdated and are not a source for official updates to this fork.
          '@ | Set-Content release-notes.txt
          gh release create v4.2.2 --target "$env:GITHUB_SHA" --title 'GenP v4.2.2' --notes-file release-notes.txt v4.2.2/Release/GenP-v4.2.2.zip v4.2.2/Release/SHA256SUMS.txt v4.2.2/Release/build-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
